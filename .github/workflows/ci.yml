name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: xcodebuild -project Cadence.xcodeproj -scheme Cadence -destination 'platform=macOS' test
